listen_addresses = '*'
port = 5432

shared_preload_libraries = 'citus'

max_connections = 200

wal_level = logical
max_wal_senders = 16
max_replication_slots = 16
max_worker_processes = 32

shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB

logging_collector = on
log_min_messages = warning
log_line_prefix = '%m [%p] %u@%d '