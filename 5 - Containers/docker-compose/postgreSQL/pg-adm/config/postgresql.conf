# postgresql.conf - Ambiente de Estudos
listen_addresses = '*'
port = 5432

# Memória (ajuste conforme seu notebook)
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB

# WAL e Checkpoint (importante para capítulos futuros)
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_timeout = 15min

# Logging (útil para troubleshooting)
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_min_duration_statement = 1000